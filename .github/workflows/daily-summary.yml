name: Daily Horizon Summary

on:
  workflow_dispatch:

  schedule:
    # Run every day at 00:30 UTC, which is 08:30 Singapore/China time.
    - cron: "30 0 * * *"

jobs:
  daily-summary:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra trading

      - name: Add vendored digital-oracle path
        run: echo "PYTHONPATH=$(pwd)/src/vendor/digital_oracle_full${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Verify trading dependencies
        run: |
          uv run python -c "import yfinance as yf; print('yfinance installed:', yf.__version__)"
          uv run python -c "import digital_oracle; from pathlib import Path; p=Path(digital_oracle.__file__ or '').as_posix(); print('digital_oracle file:', digital_oracle.__file__); assert p.endswith('/src/vendor/digital_oracle_full/digital_oracle/__init__.py'), f'digital_oracle must resolve to full vendored package: {p}'"
          uv run python -c "from digital_oracle import YahooPriceProvider, PriceHistoryQuery, YFinanceProvider, OptionsChainQuery, USTreasuryProvider, FearGreedProvider, WebSearchProvider, gather; print('full digital_oracle providers import ok')"
          uv run python -c "from src.market.digital_oracle_bridge import DigitalOracleBridge; from src.models import TradingConfig; b=DigitalOracleBridge(TradingConfig()); print('digital-oracle runtime:', b.describe_runtime()); assert b.available, 'DigitalOracleBridge is not available'"
          uv run python -c "import yfinance as yf; hist = yf.Ticker('QQQ').history(period='5d'); print('QQQ rows:', len(hist)); assert len(hist) > 0"

      - name: Verify digital-oracle provider smoke tests
        run: |
          uv run python - <<'PY'
          from digital_oracle import (
              YahooPriceProvider,
              PriceHistoryQuery,
              USTreasuryProvider,
              FearGreedProvider,
              WebSearchProvider,
              gather,
          )

          yahoo = YahooPriceProvider()
          treasury = USTreasuryProvider()
          fear_greed = FearGreedProvider()
          web = WebSearchProvider()

          result = gather(
              {
                  "qqq_price": lambda: yahoo.get_history(PriceHistoryQuery(symbol="QQQ", limit=5)),
                  "yield_curve": lambda: treasury.latest_yield_curve(),
                  "fear_greed": lambda: fear_greed.get_index(),
                  "vix_web": lambda: web.search("VIX current level"),
              }
          )

          print("digital-oracle gather results:", result.results.keys())
          print("digital-oracle gather errors:", result.errors)

          qqq_price = result.get_or("qqq_price", None)
          assert qqq_price is not None, "digital-oracle YahooPriceProvider returned no QQQ price result"

          bars = getattr(qqq_price, "bars", None)
          assert bars is not None and len(bars) > 0, "QQQ price history has no bars"

          print("digital-oracle QQQ bars:", len(bars))

          curve = result.get_or("yield_curve", None)
          if curve is None:
              print("WARN: USTreasuryProvider unavailable in smoke test")

          fg = result.get_or("fear_greed", None)
          if fg is None:
              print("WARN: FearGreedProvider unavailable in smoke test")

          web_result = result.get_or("vix_web", None)
          if web_result is not None:
              snippets = getattr(web_result, "snippets", ())
              print("digital-oracle web snippets:", len(snippets))
              if snippets:
                  first = snippets[0]
                  print("first web ref:", getattr(first, "title", ""), getattr(first, "url", ""))
          else:
              print("WARN: WebSearchProvider smoke test returned no result")

          assert len(result.results) >= 1, "No digital-oracle provider returned usable data"
          PY

      - name: Verify DeepSeek model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          uv run python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path
          from openai import AsyncOpenAI

          async def main():
              api_key = os.getenv("DEEPSEEK_API_KEY")
              assert api_key, "DEEPSEEK_API_KEY is missing"

              ai_config = json.loads(Path("data/config.json").read_text())["ai"]
              model = ai_config["model"]
              base_url = ai_config["base_url"]
              assert model == "deepseek-v4-pro", f"Unexpected DeepSeek model: {model}"
              assert base_url == "https://api.deepseek.com", f"Unexpected DeepSeek base_url: {base_url}"

              client = AsyncOpenAI(
                  api_key=api_key,
                  base_url=base_url,
              )

              response = await client.chat.completions.create(
                  model=model,
                  messages=[
                      {"role": "system", "content": "Return JSON only."},
                      {"role": "user", "content": "{\"ping\": \"pong\"}"}
                  ],
                  temperature=0,
                  max_tokens=64,
                  response_format={"type": "json_object"},
              )

              content = response.choices[0].message.content
              print("DeepSeek model smoke test ok:", model)
              print("Response:", content)

          asyncio.run(main())
          PY

      - name: Run Horizon with DeepSeek
        env:
          # DeepSeek API key configured in GitHub repository secrets.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # Email app password or SMTP authorization code.
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          
          # Built-in GitHub token for higher GitHub API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional webhook URL for Feishu, DingTalk, Slack, Discord, etc.
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 168

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "Daily Summary: ${{ env.DATE }}"
