name: Daily Horizon Summary

on:
  workflow_dispatch:

  schedule:
    # Run every day at 00:30 UTC, which is 08:30 Singapore/China time.
    - cron: "30 0 * * *"

jobs:
  daily-summary:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra trading

      - name: Verify trading dependencies
        run: |
          uv run python -c "import yfinance as yf; print('yfinance installed:', yf.__version__)"
          uv run python -c "import yfinance as yf; hist = yf.Ticker('QQQ').history(period='5d'); print('QQQ rows:', len(hist)); print(hist.tail())"

      - name: Run Horizon with DeepSeek
        env:
          # DeepSeek API key configured in GitHub repository secrets.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

          # Email app password or SMTP authorization code.
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          
          # Built-in GitHub token for higher GitHub API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Optional webhook URL for Feishu, DingTalk, Slack, Discord, etc.
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 168

      - name: Set current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "Daily Summary: ${{ env.DATE }}"
